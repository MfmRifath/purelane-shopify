name: CI
on:
  push:
    branches: [main]
  pull_request:

# Replaces Dawn's own CI, which cannot run outside the Shopify org:
#
# - Its Lighthouse job needs SHOP_STORE_OS2 / SHOP_PASSWORD_OS2 /
#   SHOP_ACCESS_TOKEN, which are Shopify's store secrets.
# - Its theme-check job used shopify/theme-check-action, which publishes a
#   GitHub check-run and so needs `checks: write` on GITHUB_TOKEN. Running the
#   CLI directly gives the same validation with the full output in the log and
#   no elevated permissions.

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Theme Check
        run: shopify theme check --fail-level error

  json-valid:
    name: JSON and section schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A malformed {% schema %} block does not break Liquid rendering, it just
      # makes the section silently unconfigurable in the theme editor. Worth
      # catching here rather than in the admin.
      - name: Parse every JSON file and every section schema
        run: node .github/scripts/validate-json.js
